version: 2
updates:
  # All npm updates collapse into a single weekly PR (not one-per-dep).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      all-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 3
  # Keep the GitHub Actions in ci.yml current too.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
